<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Baby Crawler</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #score {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            z-index: 100;
        }
        #game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: white;
            z-index: 1000;
        }
        #game-over.hidden {
            display: none;
        }
        #retry-button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px 2px;
            cursor: pointer;
            border-radius: 5px;
        }
        #retry-button:hover {
            background-color: #45a049;
        }
        #final-score {
            font-size: 24px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-overlay">
            <div id="controls-info">
                Use ← → Arrow Keys to Move
            </div>
            <div id="score">Bottles: 0</div>
            <div id="game-over" class="hidden">
                <h2>Game Over!</h2>
                <div id="final-score">Bottles Collected: 0</div>
                <button id="retry-button">Retry</button>
            </div>
        </div>
        <canvas id="game-canvas"></canvas>
    </div>
    <script>
        window.addEventListener('error', function(e) {
            console.error('Script error:', e);
            alert('Error loading game: ' + e.message);
        });
    </script>
    <script type="module" src="./src/game.js"></script>
</body>
</html>
